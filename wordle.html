<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: oklch(0.14 0.01 85);
  --surface: oklch(0.17 0.01 85);
  --surface-raised: oklch(0.20 0.008 85);
  --surface-high: oklch(0.24 0.008 85);
  --text-primary: oklch(0.90 0.005 85);
  --text-secondary: oklch(0.60 0.01 85);
  --text-dim: oklch(0.38 0.01 85);
  --correct: oklch(0.55 0.14 140);
  --present: oklch(0.62 0.14 90);
  --absent: oklch(0.32 0.01 85);
  --tile-border: oklch(0.28 0.01 85);
  --tile-border-active: oklch(0.48 0.02 85);
  --accent: oklch(0.68 0.17 80);
  --accent-dim: oklch(0.45 0.12 80);
  --line: oklch(0.25 0.01 85);
  --radius: 6px;
  --radius-sm: 4px;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}

html { height: 100%; }

body {
  font-family: var(--font);
  font-optical-sizing: auto;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}

.game {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  width: 100%;
  max-width: 480px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  gap: 12px;
}

.title {
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.lang-select {
  font-family: var(--font);
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px 12px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  outline: none;
}

.lang-select:hover { border-color: var(--tile-border-active); }

.lang-select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--text-secondary);
  transition: background 120ms ease-out, color 120ms ease-out, border-color 120ms ease-out;
  flex-shrink: 0;
}

.icon-btn:hover {
  background: var(--surface-raised);
  color: var(--text-primary);
  border-color: var(--tile-border-active);
}

.icon-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.icon-btn svg {
  width: 18px;
  height: 18px;
  pointer-events: none;
}

.new-game-btn {
  font-family: var(--font);
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--accent);
  background: none;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px 12px;
  cursor: pointer;
  transition: border-color 150ms, background 150ms;
  white-space: nowrap;
  flex-shrink: 0;
}

.new-game-btn:hover {
  border-color: var(--accent-dim);
  background: var(--surface-raised);
}

.board {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  width: 100%;
  max-width: 320px;
}

.tile {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border: 2px solid var(--tile-border);
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 1.5rem;
  font-weight: 700;
  text-transform: uppercase;
  transition: background 120ms ease-out, border-color 120ms ease-out, color 120ms ease-out;
}

.tile.filled { border-color: var(--tile-border-active); }
.tile.active { border-color: var(--accent); }

.tile.correct {
  background: var(--correct);
  border-color: var(--correct);
  color: oklch(1 0 0);
}

.tile.present {
  background: var(--present);
  border-color: var(--present);
  color: oklch(1 0 0);
}

.tile.absent {
  background: var(--absent);
  border-color: var(--absent);
  color: var(--text-dim);
}

.tile.shake {
  animation: shake 400ms ease-out;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10%, 50%, 90% { transform: translateX(-4px); }
  30%, 70% { transform: translateX(4px); }
}

.keyboard {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 100%;
  max-width: 480px;
}

.keyboard-row {
  display: flex;
  justify-content: center;
  gap: 4px;
}

.key {
  height: 44px;
  min-width: 28px;
  padding: 0 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: var(--font);
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-primary);
  transition: background 80ms ease-out, color 80ms ease-out;
  flex: 1;
  max-width: 44px;
  -webkit-appearance: none;
}

.key:hover { background: var(--surface-raised); }

.key:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.key.wide { max-width: 56px; flex: 1.5; font-size: 0.6875rem; }

.key.correct { background: var(--correct); color: oklch(1 0 0); }
.key.present { background: var(--present); color: oklch(1 0 0); }
.key.absent { background: var(--absent); color: var(--text-dim); }

.toast {
  position: fixed;
  top: 48px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface-high);
  color: var(--text-primary);
  padding: 10px 24px;
  border-radius: var(--radius);
  font-size: 0.8125rem;
  font-weight: 500;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms ease-out;
}

.toast.show {
  opacity: 1;
  pointer-events: auto;
}

.overlay {
  position: fixed;
  inset: 0;
  background: oklch(0 0 0 / 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 250ms ease-out;
}

.overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

.overlay-content {
  background: var(--surface);
  border-radius: 12px;
  padding: 32px;
  max-width: 440px;
  width: calc(100% - 32px);
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.overlay-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.overlay-title {
  font-size: 1.125rem;
  font-weight: 600;
}

.close-btn {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--text-secondary);
  transition: color 120ms, border-color 120ms;
}

.close-btn:hover { color: var(--text-primary); border-color: var(--tile-border-active); }
.close-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.lang-tabs {
  display: flex;
  gap: 4px;
}

.lang-tab {
  font-family: var(--font);
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--surface-raised);
  border: none;
  border-radius: var(--radius-sm);
  padding: 6px 16px;
  cursor: pointer;
  transition: background 120ms, color 120ms;
}

.lang-tab:hover { color: var(--text-primary); }

.lang-tab.active {
  background: var(--accent);
  color: oklch(1 0 0);
}

.lang-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.word-stats {
  font-size: 0.8125rem;
  color: var(--text-secondary);
}

.word-list {
  max-height: 260px;
  overflow-y: auto;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-content: flex-start;
}

.word-chip {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--surface-raised);
  border-radius: var(--radius-sm);
  padding: 3px 8px;
  font-size: 0.8125rem;
  font-weight: 500;
  text-transform: uppercase;
  color: var(--text-primary);
}

.word-chip.custom { border: 1px solid var(--accent-dim); }

.word-chip-remove {
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 0.75rem;
  padding: 0;
  line-height: 1;
  transition: color 120ms;
}

.word-chip-remove:hover { color: oklch(0.65 0.15 20); }

.add-section {
  display: flex;
  gap: 8px;
}

.add-input {
  flex: 1;
  font-family: var(--font);
  font-size: 0.8125rem;
  color: var(--text-primary);
  background: var(--surface-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px 12px;
  outline: none;
  text-transform: lowercase;
  transition: border-color 120ms;
}

.add-input::placeholder { color: var(--text-dim); }
.add-input:focus { border-color: var(--accent); }

.btn {
  font-family: var(--font);
  font-size: 0.8125rem;
  font-weight: 500;
  border-radius: var(--radius);
  padding: 8px 16px;
  cursor: pointer;
  transition: background 150ms ease-out, border-color 150ms ease-out;
  white-space: nowrap;
}

.btn-primary {
  color: oklch(1 0 0);
  background: var(--accent);
  border: none;
}

.btn-primary:hover { background: var(--accent-dim); }

.btn-secondary {
  color: var(--accent);
  background: none;
  border: 1px solid var(--line);
}

.btn-secondary:hover {
  border-color: var(--accent-dim);
  background: var(--surface-raised);
}

.import-export {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.hidden-input { display: none; }

.loading {
  grid-column: 1 / -1;
  text-align: center;
  padding: 40px 0;
  color: var(--text-secondary);
  font-size: 0.875rem;
}

@media (max-width: 480px) {
  body { padding: 16px; }
  .game { gap: 20px; }
  .header-right { gap: 4px; }
  .new-game-btn { font-size: 0.6875rem; padding: 6px 10px; }
  .tile { font-size: 1.25rem; }
  .key { height: 40px; font-size: 0.6875rem; max-width: 36px; }
  .key.wide { max-width: 48px; }
  .overlay-content { padding: 24px 20px; max-height: 90vh; }
}
</style>
</head>
<body>

<div class="game" role="main" aria-label="Wordle">
  <div class="header">
    <h1 class="title">Wordle</h1>
    <div class="header-right">
      <select class="lang-select" id="lang-select" aria-label="Language"></select>
      <button class="new-game-btn" id="new-game-btn" aria-label="Start a new game">New</button>
      <button class="icon-btn" id="settings-btn" aria-label="Manage words">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="board" id="board" role="group" aria-label="Word grid, 6 rows of 5 letters"></div>

  <div class="keyboard" id="keyboard" role="group" aria-label="Keyboard"></div>
</div>

<div class="toast" id="toast" aria-live="polite"></div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Word editor">
  <div class="overlay-content">
    <div class="overlay-header">
      <div class="overlay-title">Answer words</div>
      <button class="close-btn" id="overlay-close" aria-label="Close">&#x2715;</button>
    </div>
    <div class="lang-tabs" id="lang-tabs"></div>
    <div class="word-stats" id="word-stats"></div>
    <div class="word-list" id="word-list"></div>
    <div class="add-section">
      <input class="add-input" id="add-input" type="text" maxlength="60" placeholder="Add words, one per line..." aria-label="Add words">
      <button class="btn btn-primary" id="add-btn">Add</button>
    </div>
    <div class="import-export">
      <button class="btn btn-secondary" id="export-btn">Export JSON</button>
      <button class="btn btn-secondary" id="import-btn">Import file</button>
      <button class="btn btn-secondary" id="paste-btn">Import from clipboard</button>
      <button class="btn btn-secondary" id="share-btn">Copy for sharing</button>
    </div>
    <input type="file" class="hidden-input" id="import-file" accept=".json">
  </div>
</div>

<script>
(function() {
  'use strict';

  const DATA_VERSION = 2;
  const WORD_LENGTH = 5;
  const MAX_GUESSES = 6;

  const FALLBACK_ANSWERS = {
    en: ["about","after","apple","beach","brain","bread","clean","cloud","dance","dream","earth","flash","frame","glass","green","happy","heart","house","light","money","night","ocean","paint","peace","plant","queen","river","seven","shape","smile","snake","space","stone","sugar","table","think","tiger","train","under","value","water","woman","world","write","young"],
    sl: ["angel","avtor","barva","besed","blizu","cesar","cesta","danes","dekle","delo","denar","dober","domov","glava","hotel","imeti","kadar","lahko","morje","mesto","najti","okrog","oseba","polje","potem","pravi","rekel","slika","smrti","sploh","trava","treba","vedel","vreme","vrata","zgod","zmaga","zunaj","želel","žival"]
  };

  const FALLBACK_GUESSES = {
    en: FALLBACK_ANSWERS.en.concat(["abuse","adopt","alarm","album","alien","allow","arena","argue","avoid","badge","basic","begin","birth","black","blade","bless","blind","blood","bloom","board","bound","brand","brave","break","brick","brief","bring","broad","brown","build","cabin","cable","carry","catch","cause","chain","chair","chaos","charm","chart","chase","cheap","check","chest","chief","civil","claim","class","clear","clerk","click","climb","clock","close","coach","count","court","cover","crack","craft","crash","cream","crime","cross","crowd","crown","cycle","death","delay","depth","devil","donor","doubt","draft","drama","drift","drink","drive","eager","early","eight","elect","elite","empty","enemy","enjoy","enter","equal","error","essay","event","exact","exist","extra","faith","false","fault","fever","field","fight","final","fixed","flame","flesh","float","floor","focus","force","fraud","fruit","ghost","giant","grain","grand","grant","graph","grasp","grass","grave","great","greet","gross","group","guard","guess","guide","heavy","honey","honor","horse","human","ideal","image","index","inner","input","issue","joint","judge","knife","knock","label","labor","large","laugh","layer","learn","leave","legal","level","limit","local","logic","lover","lucky","lunch","major","march","match","mayor","media","mercy","metal","might","minor","mixed","model","month","moral","mount","mouse","mouth","movie","music","nerve","noise","north","novel","nurse","offer","opera","orbit","order","other","owner","panel","panic","paper","party","pause","phase","phone","photo","piano","piece","pilot","pitch","plain","plane","plate","point","pound","power","press","price","pride","prime","print","prior","prize","proof","proud","prove","queen","quick","quiet","quite","quote","radar","radio","raise","range","rapid","ratio","reach","react","ready","reply","right","rival","round","route","royal","rural","scale","scene","scope","score","seize","sense","serve","setup","shade","shaft","shake","shall","shame","sharp","sheep","sheet","shelf","shell","shift","shore","short","sight","sixth","sixty","skill","slave","sleep","slice","slide","small","smart","smell","solid","solve","sorry","spare","speak","speed","spend","spent","split","sport","stack","staff","stage","stamp","stand","stare","start","state","steam","steel","stick","still","stock","storm","story","strip","stuck","study","stuff","style","suite","super","swear","sweet","swing","sword","taste","teach","teeth","terms","theme","thick","thing","third","throw","thumb","tight","title","today","token","topic","total","touch","tough","tower","track","trade","trail","train","treat","trend","trial","tribe","trick","troop","truck","trust","truth","twice","union","unity","upper","usage","valid","video","virus","visit","vital","voice","voter","waste","watch","weave","wheel","where","whole","worry","worth","wound","yield"]),
    sl: FALLBACK_ANSWERS.sl
  };

  let answerWords = {};
  let guessWords = {};
  let customAnswers = {};
  let lang = 'en';
  let target = '';
  let guesses = [];
  let currentGuess = '';
  let gameOver = false;
  let editLang = 'en';

  const boardEl     = document.getElementById('board');
  const keyboardEl  = document.getElementById('keyboard');
  const toastEl     = document.getElementById('toast');
  const overlayEl   = document.getElementById('overlay');
  const langSelect  = document.getElementById('lang-select');

  function loadCustomAnswers() {
    try {
      const raw = localStorage.getItem('wordle-custom-answers');
      if (raw) customAnswers = JSON.parse(raw);
    } catch (e) { customAnswers = {}; }
  }

  function saveCustomAnswers() {
    try { localStorage.setItem('wordle-custom-answers', JSON.stringify(customAnswers)); } catch (e) {}
  }

  function loadState() {
    try {
      const raw = localStorage.getItem('wordle-state');
      if (raw) {
        const s = JSON.parse(raw);
        lang = s.lang || 'en';
        target = s.target || '';
        guesses = s.guesses || [];
        currentGuess = s.currentGuess || '';
        gameOver = s.gameOver || false;
      }
    } catch (e) { resetGame(); }
  }

  function saveState() {
    try {
      localStorage.setItem('wordle-state', JSON.stringify({ lang, target, guesses, currentGuess, gameOver }));
    } catch (e) {}
  }

  async function fetchWords(l, type) {
    const filename = type === 'answers' ? 'words' : 'guesses';
    const url = filename + '-' + l + '.json?v=' + DATA_VERSION;
    const cacheKey = 'wordle-' + type + '-' + l;

    try {
      const resp = await fetch(url);
      if (resp.ok) {
        const words = await resp.json();
        localStorage.setItem(cacheKey, JSON.stringify(words));
        return words;
      }
    } catch (e) {}

    try {
      const cached = localStorage.getItem(cacheKey);
      if (cached) return JSON.parse(cached);
    } catch (e) {}

    return FALLBACK_ANSWERS[l] || FALLBACK_GUESSES[l] || [];
  }

  async function loadAllWords() {
    boardEl.innerHTML = '<div class="loading">Loading word lists&hellip;</div>';

    const langKeys = Object.keys(FALLBACK_ANSWERS);
    const results = await Promise.all(
      langKeys.flatMap(l => [
        fetchWords(l, 'answers').then(w => ({ l, type: 'answers', w })),
        fetchWords(l, 'guesses').then(w => ({ l, type: 'guesses', w }))
      ])
    );

    for (const { l, type, w } of results) {
      if (type === 'answers') answerWords[l] = w;
      else guessWords[l] = w;
    }
  }

  function allAnswers(l) {
    const built = new Set(answerWords[l] || []);
    for (const w of (customAnswers[l] || [])) {
      if (w.length === WORD_LENGTH) built.add(w);
    }
    return [...built];
  }

  function allGuesses(l) {
    const set = new Set(guessWords[l] || []);
    for (const w of allAnswers(l)) set.add(w);
    return [...set];
  }

  function pickTarget(l) {
    const words = allAnswers(l);
    if (words.length === 0) return null;
    return words[Math.floor(Math.random() * words.length)].toLowerCase();
  }

  function getLetterStates() {
    const states = {};
    for (const g of guesses) {
      const remaining = {};
      for (const ch of target) remaining[ch] = (remaining[ch] || 0) + 1;
      const result = new Array(WORD_LENGTH).fill('absent');

      for (let j = 0; j < WORD_LENGTH; j++) {
        if (g[j] === target[j]) { result[j] = 'correct'; remaining[g[j]]--; }
      }
      for (let j = 0; j < WORD_LENGTH; j++) {
        if (result[j] !== 'correct' && remaining[g[j]] > 0) {
          result[j] = 'present'; remaining[g[j]]--;
        }
      }
      for (let j = 0; j < WORD_LENGTH; j++) {
        if (!states[g[j]] || states[g[j]] === 'absent') states[g[j]] = result[j];
        else if (states[g[j]] === 'present' && result[j] === 'correct') states[g[j]] = 'correct';
      }
    }
    return states;
  }

  function getLetterStatesForGuess(guessIdx, col) {
    const g = guesses[guessIdx];
    const remaining = {};
    for (const ch of target) remaining[ch] = (remaining[ch] || 0) + 1;
    const result = new Array(WORD_LENGTH).fill('absent');

    for (let j = 0; j < WORD_LENGTH; j++) {
      if (g[j] === target[j]) { result[j] = 'correct'; remaining[g[j]]--; }
    }
    for (let j = 0; j < WORD_LENGTH; j++) {
      if (result[j] !== 'correct' && remaining[g[j]] > 0) {
        result[j] = 'present'; remaining[g[j]]--;
      }
    }
    return result[col];
  }

  function renderBoard() {
    boardEl.innerHTML = '';
    for (let r = 0; r < MAX_GUESSES; r++) {
      for (let c = 0; c < WORD_LENGTH; c++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        if (r < guesses.length) {
          tile.textContent = guesses[r][c] || '';
          tile.classList.add('filled', getLetterStatesForGuess(r, c));
        } else if (r === guesses.length && !gameOver) {
          tile.textContent = currentGuess[c] || '';
          if (c === currentGuess.length) tile.classList.add('active');
          if (currentGuess[c]) tile.classList.add('filled');
        }
        boardEl.appendChild(tile);
      }
    }
  }

  function renderKeyboard() {
    keyboardEl.innerHTML = '';
    const rows = [
      ['q','w','e','r','t','y','u','i','o','p'],
      ['a','s','d','f','g','h','j','k','l'],
      ['Enter','z','x','c','v','b','n','m','Back']
    ];
    const states = getLetterStates();

    for (const row of rows) {
      const rowEl = document.createElement('div');
      rowEl.className = 'keyboard-row';
      for (const key of row) {
        const btn = document.createElement('button');
        btn.className = 'key';
        btn.textContent = key === 'Back' ? '⌫' : key;
        if (key === 'Enter' || key === 'Back') btn.classList.add('wide');
        const lower = key.toLowerCase();
        if (states[lower]) btn.classList.add(states[lower]);
        btn.addEventListener('click', () => handleKey(key));
        rowEl.appendChild(btn);
      }
      keyboardEl.appendChild(rowEl);
    }
  }

  function handleKey(key) {
    if (gameOver) return;

    if (key === 'Enter') {
      if (currentGuess.length !== WORD_LENGTH) {
        showToast('Not enough letters'); shakeBoard(); return;
      }
      if (!allGuesses(lang).includes(currentGuess)) {
        showToast('Not in word list'); shakeBoard(); return;
      }
      guesses.push(currentGuess);
      currentGuess = '';
      saveState();
      render();
      if (guesses[guesses.length - 1] === target) {
        gameOver = true; saveState();
        const tries = guesses.length;
        showToast((tries <= 2 ? '🎯 ' : tries <= 4 ? '👏 ' : '👍 ') + 'Got it in ' + tries + '!', 2500);
      } else if (guesses.length >= MAX_GUESSES) {
        gameOver = true; saveState();
        showToast('Answer: ' + target.toUpperCase(), 3000);
      }
      render();
      return;
    }

    if (key === 'Back') {
      if (currentGuess.length > 0) { currentGuess = currentGuess.slice(0, -1); saveState(); render(); }
      return;
    }

    if (currentGuess.length < WORD_LENGTH && /^[a-zA-Z]$/.test(key)) {
      currentGuess += key.toLowerCase(); saveState(); render();
    }
  }

  function shakeBoard() {
    const tiles = boardEl.querySelectorAll('.tile');
    const rowStart = guesses.length * WORD_LENGTH;
    for (let i = rowStart; i < rowStart + WORD_LENGTH && i < tiles.length; i++) {
      tiles[i].classList.add('shake');
      tiles[i].addEventListener('animationend', () => tiles[i].classList.remove('shake'), { once: true });
    }
  }

  function showToast(msg, duration) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._timeout);
    toastEl._timeout = setTimeout(() => toastEl.classList.remove('show'), duration || 1500);
  }

  function render() { renderBoard(); renderKeyboard(); }

  function resetGame() {
    target = pickTarget(lang);
    guesses = [];
    currentGuess = '';
    gameOver = false;
    saveState();
    render();
  }

  function newGame() {
    if (allAnswers(lang).length === 0) {
      showToast('No answer words available. Add some in settings.');
      return;
    }
    resetGame();
  }

  function changeLanguage(l) {
    if (l === lang) return;
    lang = l;
    langSelect.value = l;
    resetGame();
  }

  function populateLangSelect() {
    langSelect.innerHTML = '';
    const labels = { en: 'English', sl: 'Sloven\u0161\u010dina' };
    for (const l of Object.keys(FALLBACK_ANSWERS)) {
      const opt = document.createElement('option');
      opt.value = l;
      opt.textContent = labels[l] || l;
      langSelect.appendChild(opt);
    }
    langSelect.value = lang;
    if (!FALLBACK_ANSWERS[lang]) {
      lang = Object.keys(FALLBACK_ANSWERS)[0];
      langSelect.value = lang;
    }
  }

  function openOverlay() {
    editLang = lang;
    overlayEl.classList.add('visible');
    renderOverlay();
  }

  function closeOverlay() { overlayEl.classList.remove('visible'); }

  function renderOverlay() { renderLangTabs(); renderWordList(); }

  function renderLangTabs() {
    const tabs = document.getElementById('lang-tabs');
    tabs.innerHTML = '';
    const labels = { en: 'English', sl: 'Sloven\u0161\u010dina' };
    for (const l of Object.keys(FALLBACK_ANSWERS)) {
      const btn = document.createElement('button');
      btn.className = 'lang-tab' + (l === editLang ? ' active' : '');
      btn.textContent = labels[l] || l;
      btn.addEventListener('click', () => { editLang = l; renderOverlay(); });
      tabs.appendChild(btn);
    }
  }

  function renderWordList() {
    const list = document.getElementById('word-list');
    const stats = document.getElementById('word-stats');
    const built = new Set(answerWords[editLang] || []);
    const custom = new Set((customAnswers[editLang] || []).filter(w => w.length === WORD_LENGTH));
    const all = [...new Set([...built, ...custom])].sort();

    stats.textContent = all.length + ' answer words (' + built.size + ' built-in, ' + custom.size + ' custom)';
    list.innerHTML = '';

    for (const word of all) {
      const chip = document.createElement('span');
      chip.className = 'word-chip';
      if (custom.has(word) && !built.has(word)) chip.classList.add('custom');
      chip.textContent = word;

      const remove = document.createElement('button');
      remove.className = 'word-chip-remove';
      remove.textContent = '\u00d7';
      remove.setAttribute('aria-label', 'Remove ' + word);

      if (built.has(word) && !custom.has(word)) {
        remove.style.visibility = 'hidden';
      }
      remove.addEventListener('click', () => removeWord(word));
      chip.appendChild(remove);
      list.appendChild(chip);
    }
  }

  function removeWord(word) {
    const built = new Set(answerWords[editLang] || []);
    if (built.has(word) && !(customAnswers[editLang] || []).includes(word)) return;

    if (!customAnswers[editLang]) customAnswers[editLang] = [];
    customAnswers[editLang] = customAnswers[editLang].filter(w => w !== word);
    saveCustomAnswers();
    renderOverlay();
    if (editLang === lang && target === word) resetGame();
  }

  function addWords(inputStr) {
    const raw = inputStr.split(/[\n,;\s]+/).map(w => w.trim().toLowerCase()).filter(
      w => w.length === WORD_LENGTH && /^[a-zA-Z\u010d\u0107\u017e\u0161\u0111\u010c\u0106\u017d\u0160\u0110]+$/.test(w)
    );
    if (raw.length === 0) {
      showToast('Enter at least one ' + WORD_LENGTH + '-letter word');
      return;
    }

    if (!customAnswers[editLang]) customAnswers[editLang] = [];
    const built = new Set(answerWords[editLang] || []);
    let added = 0;
    for (const w of raw) {
      if (!built.has(w) && !customAnswers[editLang].includes(w)) {
        customAnswers[editLang].push(w);
        added++;
      }
    }
    saveCustomAnswers();
    renderOverlay();
    document.getElementById('add-input').value = '';
    showToast('Added ' + added + ' word' + (added !== 1 ? 's' : ''));
  }

  function exportWords() {
    const data = { customAnswers, version: 1 };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'wordle-words.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Exported');
  }

  function importWordsData(data) {
    try {
      const parsed = typeof data === 'string' ? JSON.parse(data) : data;
      if (parsed.customAnswers) {
        for (const l of Object.keys(parsed.customAnswers)) {
          if (!customAnswers[l]) customAnswers[l] = [];
          for (const w of parsed.customAnswers[l]) {
            if (!customAnswers[l].includes(w)) customAnswers[l].push(w);
          }
        }
        saveCustomAnswers();
        renderOverlay();
        return true;
      }
      showToast('Invalid file format');
      return false;
    } catch (e) { showToast('Invalid JSON'); return false; }
  }

  function importFile(file) {
    const reader = new FileReader();
    reader.onload = () => { importWordsData(reader.result); };
    reader.readAsText(file);
  }

  function pasteImport() {
    navigator.clipboard.readText().then(text => {
      if (importWordsData(text)) showToast('Imported from clipboard');
    }).catch(() => showToast('Clipboard access denied', 1500));
  }

  function shareWords() {
    const data = JSON.stringify({ customAnswers, version: 1 });
    navigator.clipboard.writeText(data).then(() => {
      showToast('Copied. Paste in settings to import on another device.', 2500);
    }).catch(() => showToast('Could not copy', 1500));
  }

  function init() {
    langSelect.addEventListener('change', () => changeLanguage(langSelect.value));
    document.getElementById('new-game-btn').addEventListener('click', newGame);
    document.getElementById('settings-btn').addEventListener('click', openOverlay);
    document.getElementById('overlay-close').addEventListener('click', closeOverlay);
    overlayEl.addEventListener('click', e => { if (e.target === overlayEl) closeOverlay(); });
    document.getElementById('add-btn').addEventListener('click', () => {
      addWords(document.getElementById('add-input').value);
    });
    document.getElementById('add-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); addWords(e.target.value); }
    });
    document.getElementById('export-btn').addEventListener('click', exportWords);
    document.getElementById('import-btn').addEventListener('click', () => {
      document.getElementById('import-file').click();
    });
    document.getElementById('paste-btn').addEventListener('click', pasteImport);
    document.getElementById('import-file').addEventListener('change', e => {
      if (e.target.files[0]) importFile(e.target.files[0]); e.target.value = '';
    });
    document.getElementById('share-btn').addEventListener('click', shareWords);

    document.addEventListener('keydown', e => {
      if (overlayEl.classList.contains('visible')) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'Enter') { e.preventDefault(); handleKey('Enter'); return; }
      if (e.key === 'Backspace') { e.preventDefault(); handleKey('Back'); return; }
      if (/^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); handleKey(e.key); }
    });
  }

  async function start() {
    loadCustomAnswers();
    await loadAllWords();
    populateLangSelect();
    loadState();

    if (!target || !allAnswers(lang).includes(target)) {
      const t = pickTarget(lang);
      if (!t) {
        boardEl.innerHTML = '<div class="loading">No answer words available. Open settings to add some.</div>';
        keyboardEl.innerHTML = '';
        return;
      }
      target = t;
      guesses = [];
      currentGuess = '';
      gameOver = false;
      saveState();
    }

    render();

    if (gameOver && guesses.length > 0) {
      if (guesses[guesses.length - 1] === target) {
        showToast('You solved it!', 2000);
      } else {
        showToast('Answer: ' + target.toUpperCase(), 3000);
      }
    }
  }

  init();
  start();
})();
</script>
</body>
</html>
