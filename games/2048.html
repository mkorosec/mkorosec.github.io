<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: oklch(0.14 0.01 85);
  --surface: oklch(0.17 0.008 85);
  --surface-raised: oklch(0.20 0.008 85);
  --text-primary: oklch(0.90 0.005 85);
  --text-secondary: oklch(0.58 0.01 85);
  --text-dim: oklch(0.38 0.01 85);
  --accent: oklch(0.68 0.17 80);
  --accent-dim: oklch(0.45 0.12 80);
  --accent-surface: oklch(0.22 0.025 80);
  --line: oklch(0.23 0.01 85);
  --error: oklch(0.58 0.14 20);
  --radius: 8px;
  --radius-sm: 4px;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}

html { height: 100%; }

body {
  font-family: var(--font);
  font-optical-sizing: auto;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}

.game {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
  width: 100%;
  max-width: 480px;
}

.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  width: 100%;
}

.title {
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: 0.04em;
}

.scores {
  display: flex;
  gap: 8px;
  width: 100%;
  max-width: 400px;
}

.score-box {
  flex: 1;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-height: 60px;
  justify-content: center;
}

.score-label {
  font-size: 0.6875rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
}

.score-value {
  font-size: 1.25rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
}

.new-game-btn {
  font-family: var(--font);
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--accent);
  background: none;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 24px;
  cursor: pointer;
  min-height: 44px;
  min-width: 44px;
  transition: border-color 150ms ease-out, background 150ms ease-out;
}

.new-game-btn:hover {
  border-color: var(--accent-dim);
  background: var(--accent-surface);
}

.new-game-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.board-wrapper {
  position: relative;
  width: 100%;
  max-width: 400px;
}

.board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  background: var(--surface);
  border-radius: 12px;
  padding: 12px;
  touch-action: none;
}

.cell {
  aspect-ratio: 1;
  background: oklch(0.20 0.005 85);
  border-radius: var(--radius);
  position: relative;
}

.tile {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.tile--new {
  animation: tile-pop 200ms ease-out;
}

.tile--merged {
  animation: tile-merge 200ms ease-out;
}

@keyframes tile-pop {
  0%   { transform: scale(0); opacity: 0; }
  80%  { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes tile-merge {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.25); }
  100% { transform: scale(1); }
}

.win-banner {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  max-width: 400px;
  background: var(--accent-surface);
  border: 1px solid oklch(0.38 0.08 80);
  border-radius: 12px;
  padding: 16px 20px;
  min-height: 44px;
}

.win-banner.visible {
  display: flex;
}

.win-banner-text {
  font-size: 0.9375rem;
  font-weight: 600;
  color: var(--accent);
}

.win-banner-actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.win-btn {
  font-family: var(--font);
  font-size: 0.8125rem;
  font-weight: 500;
  border: none;
  border-radius: var(--radius);
  padding: 8px 16px;
  cursor: pointer;
  min-height: 44px;
  min-width: 44px;
  transition: background 150ms ease-out;
  white-space: nowrap;
}

.win-btn--continue {
  color: oklch(0.15 0.01 85);
  background: var(--accent);
}

.win-btn--continue:hover {
  background: var(--accent-dim);
}

.win-btn--new {
  color: var(--text-secondary);
  background: var(--surface-raised);
}

.win-btn--new:hover {
  color: var(--text-primary);
  background: oklch(0.23 0.01 85);
}

.win-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.overlay {
  position: fixed;
  inset: 0;
  background: oklch(0 0 0 / 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 250ms ease-out;
}

.overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

.overlay-content {
  background: var(--surface);
  border-radius: 12px;
  padding: 40px 48px;
  text-align: center;
  max-width: 360px;
  width: calc(100% - 48px);
}

.overlay-title {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 8px;
}

.overlay-stats {
  font-size: 0.875rem;
  color: var(--text-secondary);
  margin-bottom: 24px;
  line-height: 1.6;
}

.overlay-stats strong {
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}

.overlay-btn {
  font-family: var(--font);
  font-size: 0.875rem;
  font-weight: 500;
  color: oklch(0.15 0.01 85);
  background: var(--accent);
  border: none;
  border-radius: var(--radius);
  padding: 12px 32px;
  cursor: pointer;
  min-height: 44px;
  min-width: 44px;
  transition: background 150ms ease-out;
}

.overlay-btn:hover { background: var(--accent-dim); }

.overlay-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (max-width: 480px) {
  body { padding: 16px; }
  .game { gap: 24px; }
  .board { gap: 8px; padding: 8px; border-radius: 10px; }
  .overlay-content { padding: 32px 24px; }
  .win-banner {
    flex-direction: column;
    align-items: flex-start;
    padding: 14px 16px;
  }
}
</style>
</head>
<body>

<div class="game" role="main" aria-label="2048">
  <div class="header">
    <h1 class="title">2048</h1>
    <div class="scores">
      <div class="score-box">
        <span class="score-label">Score</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">Best</span>
        <span class="score-value" id="best-score">0</span>
      </div>
    </div>
    <div class="toolbar">
      <button class="new-game-btn" aria-label="Start a new game">New game</button>
    </div>
  </div>

  <div class="win-banner" id="win-banner" role="status" aria-live="polite">
    <span class="win-banner-text">You reached 2048!</span>
    <div class="win-banner-actions">
      <button class="win-btn win-btn--continue" id="win-continue">Keep going</button>
      <button class="win-btn win-btn--new" id="win-restart">New game</button>
    </div>
  </div>

  <div class="board-wrapper">
    <div class="board" id="board" role="grid" aria-label="2048 game board"></div>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Game over">
  <div class="overlay-content">
    <div class="overlay-title" id="overlay-title">Game over</div>
    <div class="overlay-stats" id="overlay-stats"></div>
    <button class="overlay-btn" id="overlay-btn">Play again</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  const STORAGE_KEY = 'game-2048';

  const TILE_COLORS = {
    2:    { bg: 'oklch(0.88 0.01 85)', text: 'oklch(0.20 0.01 85)' },
    4:    { bg: 'oklch(0.84 0.02 82)', text: 'oklch(0.20 0.01 85)' },
    8:    { bg: 'oklch(0.60 0.12 60)', text: 'oklch(0.98 0 0)' },
    16:   { bg: 'oklch(0.57 0.13 50)', text: 'oklch(0.98 0 0)' },
    32:   { bg: 'oklch(0.54 0.14 40)', text: 'oklch(0.98 0 0)' },
    64:   { bg: 'oklch(0.51 0.15 30)', text: 'oklch(0.98 0 0)' },
    128:  { bg: 'oklch(0.54 0.16 80)', text: 'oklch(0.98 0 0)' },
    256:  { bg: 'oklch(0.58 0.16 78)', text: 'oklch(0.98 0 0)' },
    512:  { bg: 'oklch(0.62 0.17 75)', text: 'oklch(0.98 0 0)' },
    1024: { bg: 'oklch(0.65 0.17 80)', text: 'oklch(0.98 0 0)' },
    2048: { bg: 'oklch(0.68 0.17 80)', text: 'oklch(0.15 0.01 85)' },
  };

  let grid = new Array(16).fill(0);
  let score = 0;
  let bestScore = 0;
  let won = false;
  let wonAndContinued = false;
  let gameOver = false;

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestScoreEl = document.getElementById('best-score');
  const winBannerEl = document.getElementById('win-banner');
  const overlayEl = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayStats = document.getElementById('overlay-stats');

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const saved = JSON.parse(raw);
      if (!saved || !Array.isArray(saved.grid) || saved.grid.length !== 16) return false;
      grid = saved.grid;
      score = saved.score || 0;
      bestScore = saved.bestScore || 0;
      won = !!saved.won;
      wonAndContinued = !!saved.wonAndContinued;
      gameOver = !!saved.gameOver;
      return true;
    } catch (e) {
      return false;
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        grid: grid,
        score: score,
        bestScore: bestScore,
        won: won,
        wonAndContinued: wonAndContinued,
        gameOver: gameOver,
      }));
    } catch (e) {}
  }

  function initGame() {
    if (!load()) {
      grid = new Array(16).fill(0);
      score = 0;
      won = false;
      wonAndContinued = false;
      gameOver = false;
      spawnTile();
      spawnTile();
    }
    updateScoreDisplay();
    render();
    if (gameOver) {
      showGameOverOverlay();
    } else if (won && !wonAndContinued) {
      winBannerEl.classList.add('visible');
    }
  }

  function updateScoreDisplay() {
    scoreEl.textContent = score;
    bestScoreEl.textContent = bestScore;
  }

  function emptyCells() {
    const empty = [];
    for (let i = 0; i < 16; i++) {
      if (grid[i] === 0) empty.push(i);
    }
    return empty;
  }

  function spawnTile() {
    const empty = emptyCells();
    if (empty.length === 0) return -1;
    const idx = empty[Math.floor(Math.random() * empty.length)];
    grid[idx] = Math.random() < 0.9 ? 2 : 4;
    return idx;
  }

  function compressLine(line) {
    const arr = line.filter(function(v) { return v !== 0; });
    let gained = 0;
    const mergePositions = [];
    let writeIdx = 0;

    for (let i = 0; i < arr.length; i++) {
      if (i < arr.length - 1 && arr[i] === arr[i + 1]) {
        arr[writeIdx] = arr[i] * 2;
        gained += arr[writeIdx];
        mergePositions.push(writeIdx);
        i++;
      } else {
        arr[writeIdx] = arr[i];
      }
      writeIdx++;
    }

    const result = new Array(4).fill(0);
    for (let i = 0; i < writeIdx; i++) {
      result[i] = arr[i];
    }

    return { result: result, gained: gained, merges: mergePositions };
  }

  function move(dir) {
    const prevGrid = grid.slice();
    const newGrid = grid.slice();
    let scoreGain = 0;
    const mergedIndices = new Set();

    const isHorizontal = dir === 'left' || dir === 'right';
    const isReversed = dir === 'right' || dir === 'down';

    for (let i = 0; i < 4; i++) {
      let line = [];
      for (let j = 0; j < 4; j++) {
        const idx = isHorizontal ? i * 4 + j : j * 4 + i;
        line.push(newGrid[idx]);
      }
      if (isReversed) line.reverse();

      const compressed = compressLine(line);
      scoreGain += compressed.gained;

      let resultLine = compressed.result;
      if (isReversed) resultLine = resultLine.reverse();

      for (let j = 0; j < 4; j++) {
        const idx = isHorizontal ? i * 4 + j : j * 4 + i;
        newGrid[idx] = resultLine[j];
      }

      for (let m = 0; m < compressed.merges.length; m++) {
        const mp = compressed.merges[m];
        const actualMPos = isReversed ? (3 - mp) : mp;
        const idx = isHorizontal ? i * 4 + actualMPos : actualMPos * 4 + i;
        mergedIndices.add(idx);
      }
    }

    let moved = false;
    for (let i = 0; i < 16; i++) {
      if (prevGrid[i] !== newGrid[i]) {
        moved = true;
        break;
      }
    }

    if (!moved) return false;

    grid = newGrid;
    score += scoreGain;
    if (score > bestScore) bestScore = score;

    const newTileIdx = spawnTile();

    render(newTileIdx, mergedIndices);
    updateScoreDisplay();

    if (!won && hasWon()) {
      won = true;
      if (!wonAndContinued) {
        winBannerEl.classList.add('visible');
      }
    }

    if (isGameOver()) {
      gameOver = true;
      setTimeout(function() { showGameOverOverlay(); }, 400);
    }

    save();
    return true;
  }

  function hasWon() {
    for (let i = 0; i < 16; i++) {
      if (grid[i] >= 2048) return true;
    }
    return false;
  }

  function isGameOver() {
    for (let i = 0; i < 16; i++) {
      if (grid[i] === 0) return false;
    }
    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 4; col++) {
        const val = grid[row * 4 + col];
        if (col < 3 && grid[row * 4 + col + 1] === val) return false;
        if (row < 3 && grid[(row + 1) * 4 + col] === val) return false;
      }
    }
    return true;
  }

  function tileStyles(value) {
    const c = TILE_COLORS[value];
    if (c) return c;
    return { bg: 'oklch(0.22 0.005 85)', text: 'oklch(0.90 0.005 85)' };
  }

  function tileFontSize(value) {
    if (value < 100) return '2.25rem';
    if (value < 1000) return '1.75rem';
    if (value < 10000) return '1.35rem';
    if (value < 100000) return '1.05rem';
    return '0.85rem';
  }

  function render(newTileIdx, mergedIndices) {
    newTileIdx = newTileIdx !== undefined ? newTileIdx : -1;
    mergedIndices = mergedIndices || new Set();

    let html = '';
    for (let i = 0; i < 16; i++) {
      html += '<div class="cell">';
      if (grid[i] !== 0) {
        const s = tileStyles(grid[i]);
        let cls = 'tile';
        if (i === newTileIdx) cls += ' tile--new';
        if (mergedIndices.has(i)) cls += ' tile--merged';
        html += '<div class="' + cls + '" style="background:' + s.bg + ';color:' + s.text + ';font-size:' + tileFontSize(grid[i]) + '">' + grid[i] + '</div>';
      }
      html += '</div>';
    }
    boardEl.innerHTML = html;
  }

  function showGameOverOverlay() {
    overlayTitle.textContent = 'Game over';
    overlayStats.innerHTML = 'Score <strong>' + score + '</strong><br>Best <strong>' + bestScore + '</strong>';
    overlayEl.classList.add('visible');
  }

  function hideOverlay() {
    overlayEl.classList.remove('visible');
  }

  function newGame() {
    grid = new Array(16).fill(0);
    score = 0;
    won = false;
    wonAndContinued = false;
    gameOver = false;
    spawnTile();
    spawnTile();
    updateScoreDisplay();
    render();
    hideOverlay();
    winBannerEl.classList.remove('visible');
    save();
  }

  function continueAfterWin() {
    wonAndContinued = true;
    winBannerEl.classList.remove('visible');
    save();
  }

  document.querySelector('.new-game-btn').addEventListener('click', newGame);
  document.getElementById('overlay-btn').addEventListener('click', newGame);
  document.getElementById('win-continue').addEventListener('click', continueAfterWin);
  document.getElementById('win-restart').addEventListener('click', newGame);

  document.addEventListener('keydown', function(e) {
    if (gameOver) return;

    const key = e.key;
    if (key === 'ArrowLeft' || key === 'ArrowRight' || key === 'ArrowUp' || key === 'ArrowDown' ||
        key === 'a' || key === 'd' || key === 'w' || key === 's') {
      e.preventDefault();
    }

    if (key === 'ArrowLeft'  || key === 'a') { move('left'); return; }
    if (key === 'ArrowRight' || key === 'd') { move('right'); return; }
    if (key === 'ArrowUp'    || key === 'w') { move('up'); return; }
    if (key === 'ArrowDown'  || key === 's') { move('down'); return; }
  });

  let touchStartX = 0;
  let touchStartY = 0;
  let touchStartTime = 0;

  boardEl.addEventListener('touchstart', function(e) {
    if (gameOver) return;
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartTime = Date.now();
  }, { passive: true });

  boardEl.addEventListener('touchend', function(e) {
    if (gameOver) return;
    if (!e.changedTouches.length) return;

    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const dt = Date.now() - touchStartTime;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);

    if (absDx < 30 && absDy < 30) return;
    if (dt > 800) return;

    if (absDx > absDy) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  });

  boardEl.addEventListener('touchmove', function(e) {
    e.preventDefault();
  }, { passive: false });

  initGame();
})();
</script>
</body>
</html>
