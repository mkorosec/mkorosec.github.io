    <rect x="0"   y="0"   width="66" height="66" rx="12" fill="#ce8900"/>
    <rect x="82"  y="0"   width="66" height="66" rx="12" fill="none" stroke="#4a3a18" stroke-width="8"/>
    <rect x="164" y="0"   width="66" height="66" rx="12" fill="none" stroke="#4a3a18" stroke-width="8"/>
    <rect x="0"   y="82"  width="66" height="66" rx="12" fill="none" stroke="#4a3a18" stroke-width="8"/>
    <rect x="82"  y="82"  width="66" height="66" rx="12" fill="#ce8900"/>
    <rect x="164" y="82"  width="66" height="66" rx="12" fill="none" stroke="#4a3a18" stroke-width="8"/>
    <rect x="0"   y="164" width="66" height="66" rx="12" fill="none" stroke="#4a3a18" stroke-width="8"/>
    <rect x="82"  y="164" width="66" height="66" rx="12" fill="none" stroke="#4a3a18" stroke-width="8"/>
    <rect x="164" y="164" width="66" height="66" rx="12" fill="#ce8900"/>
